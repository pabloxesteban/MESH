<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 94" role="img" aria-label="MESH">
  <title>MESH</title>
  <!--
    Símbolo MESH — óptico de ícono. Usar a 24px o menos, como ícono de app y
    como favicon.

    Misma construcción y mismas proporciones de caja que mesh-symbol.svg, con
    dos correcciones ópticas:

      · Trazo 14 en vez de 12. Un trazo escalado matemáticamente se afina y se
        desarma cuando el símbolo es chico; a tamaño de ícono hace falta más
        peso, no el mismo peso más chico.
      · Menos vuelo por debajo del cruce (las diagonales terminan en 45/67 en
        lugar de 38/74), así el cruce queda en (56, 72.3) — al 77% de la
        altura en lugar del 70%.

    La segunda corrección es la que importa y no es cosmética. Con el vuelo
    completo, la base tiene cuatro terminaciones seguidas; a 16px los huecos
    entre ellas caen por debajo de un píxel, se funden, y la marca se lee como
    una mancha. Al acortar el vuelo, las dos terminaciones del medio se
    juntan en un solo vértice y a 16px se lee una M limpia. El cruce vuelve a
    ser visible a partir de 32px.

    Los dos archivos tienen que verse como la misma marca a su tamaño de uso.
    Si al mismo tamaño se ven distintos, es correcto: están corregidos para
    tamaños distintos.
  -->
  <g fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 87V7l60 80" />
    <path d="M105 87V7L45 87" />
  </g>
</svg>
