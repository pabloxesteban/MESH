# Portafolio de Briza Maldonado
#
# Los pesos de estilo salen de MIRAR las fotos, no de que ella los haya
# declarado. Son una propuesta para que los corrija: es lo que define cómo se
# reparte un me gusta, así que el que tiene que tener la última palabra sobre
# qué es cada pieza es el artista.
#
# Los epígrafes van vacíos a propósito. Un epígrafe son las palabras del
# artista; describir yo la pieza sería ponerle palabras en la boca.
#
# NOTA: ninguna de estas cinco es japonés, y `japanese` figura como estilo
# secundario suyo en artist.yaml. No es una contradicción —el portafolio es una
# muestra, no el catálogo entero— pero conviene sumar alguna pieza japonesa, o
# sacar el estilo. El mazo reparte por pieza; el matching, por estilo declarado.

items:
